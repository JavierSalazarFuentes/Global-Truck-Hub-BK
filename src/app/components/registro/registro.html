<main class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">

      <div class="card shadow card-roja p-4">
        <div class="card-body">
          <h3 class="text-center text-danger fw-bold mb-4 text-uppercase">Registro</h3>

          <form (ngSubmit)="onRegistro()">
            <div class="mb-3">
              <label for="nombre" class="form-label fw-bold">Nombre</label>
              <input
                type="text"
                id="nombre"
                [(ngModel)]="nombre"
                name="nombre"
                class="form-control"
                placeholder="Tu nombre completo">
            </div>

            <div class="mb-3">
              <label for="usuario" class="form-label fw-bold">Usuario</label>
              <input
                type="text"
                id="usuario"
                [(ngModel)]="usuario"
                name="usuario"
                class="form-control"
                required
                placeholder="Elige un nombre de usuario">
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-bold">Contraseña</label>
              <input
                type="password"
                id="password"
                [(ngModel)]="password"
                name="password"
                class="form-control"
                required
                placeholder="Crea una contraseña">
            </div>

            @if (mensajeError) {
              <div class="alert alert-danger py-2 text-center" role="alert">
                {{ mensajeError }}
              </div>
            }

            @if (mensajeExito) {
              <div class="alert alert-success py-2 text-center" role="alert">
                {{ mensajeExito }}
              </div>
            }

            <button type="submit" class="btn btn-danger w-100 fw-bold rounded-pill mt-3">
              Registrarse
            </button>
          </form>

          <div class="text-center mt-3">
            <small class="text-light">¿Ya tienes una cuenta? <a routerLink="/login" class="text-danger text-decoration-none fw-bold">Inicia sesión</a></small>
          </div>

        </div>
      </div>

    </div>
  </div>
</main>
